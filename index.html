document.querySelectorAll(".section-btn").forEach((b) => b.addEventListener("click", () => showSection(b.dataset.section)));
document.querySelectorAll(".len-btn").forEach((b) => b.addEventListener("click", () => { prefs.len = Number(b.dataset.len); savePrefs(); renderPhrasesHome(); }));
document.querySelectorAll(".mode-btn").forEach((b) => b.addEventListener("click", () => { prefs.mode = b.dataset.mode; savePrefs(); renderPhrasesHome(); }));
document.querySelectorAll(".wmode-btn").forEach((b) => b.addEventListener("click", () => { prefs.wmode = b.dataset.wmode; savePrefs(); renderWordsHome(); }));
document.querySelectorAll(".wdir-btn").forEach((b) => b.addEventListener("click", () => { prefs.wdir = b.dataset.wdir; savePrefs(); renderWordsHome(); }));
$("wordLevelTabs").addEventListener("click", (e) => { const b = e.target.closest(".level-tab"); if (b) { prefs.wlevel = b.dataset.wlevel; savePrefs(); renderWordsHome(); } });
document.querySelectorAll(".snd-tab").forEach((b) => b.addEventListener("click", () => { prefs.soundTab = b.dataset.tab; savePrefs(); if (b.dataset.tab === "pairs") newPairsQuiz(); renderSounds(); }));
$("levelTabs").addEventListener("click", (e) => { const b = e.target.closest(".level-tab"); if (b) { prefs.level = b.dataset.level; savePrefs(); renderPhrasesHome(); } });

// Delegación global: escuchar palabras, practicar sonidos, abrir temas, ajustes
document.addEventListener("click", (e) => {
  const pr0 = e.target.closest(".phon-reveal");
  if (pr0) { const div = document.createElement("div"); div.className = "phon"; div.textContent = pr0.dataset.phon; pr0.parentNode.replaceWith(div); return; }
  const say = e.target.closest("[data-say]");
  if (say) { speak(say.dataset.say, { slow: say.classList.contains("word") }); return; }
  const slow = e.target.closest("[data-say-slow]");
  if (slow) { speak(slow.dataset.saySlow, { slow: true }); return; }
  const pr = e.target.closest("[data-practice]");
  if (pr) { startCustom("sound", pr.dataset.practice); return; }
  const snd = e.target.closest("[data-sound]");
  if (snd) {
    prefs.soundTab = "guide"; savePrefs(); showSection("sounds");
    const el = $("snd-" + snd.dataset.sound); if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    return;
  }
  const dk = e.target.closest("[data-deck]");
  if (dk) { startDeck(dk.dataset.deck); return; }
  const del = e.target.closest("[data-mydel]");
  if (del) { myWords.splice(Number(del.dataset.mydel), 1); saveMine(); renderWordsHome(); return; }
  const st = e.target.closest("[data-struct]");
  if (st) { startStructure(st.dataset.struct); return; }
  const set = e.target.closest(".set-btn");
  if (set) {
    const k = set.dataset.key, raw = set.dataset.val;
    settings[k] = raw === "true" ? true : raw === "false" ? false : Number(raw);
    saveSettings(); renderProgress();
  }
});

$("drillBack").addEventListener("click", () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); session = null; showSection(currentSection); });
$("drillEnd").addEventListener("click", () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); if (session) finishSession(); });
$("doneRepeat").addEventListener("click", () => { if (lastStart) lastStart(); });
$("doneHome").addEventListener("click", () => showSection(currentSection));

document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, button")) { if (e.key === " " || e.key === "Enter") return; }
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (session && session.mode === "card" && $("view-drill").classList.contains("active") && $("cardBack")) {
    if (e.key === " " && $("cardBack").hidden) { e.preventDefault(); flipCard(); return; }
    if (e.key === "1") { cardAnswer(false); return; }
    if (e.key === "2") { cardAnswer(true); return; }
  }
  if (e.key !== "Enter") return;
  if ($("view-drill").classList.contains("active") && checked) {
    e.preventDefault();
    nextDrill();
  }
});

// Tema claro / oscuro
function effectiveDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  $("themeToggle").textContent = effectiveDark() ? "☀️" : "🌙";
}
applyTheme(lsGet(K.theme));
$("themeToggle").addEventListener("click", () => { const t = effectiveDark() ? "light" : "dark"; lsSet(K.theme, t); applyTheme(t); });

showSection("phrases");
</script>
</body>
